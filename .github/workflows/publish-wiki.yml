name: Publish wiki
on:
  push:
    branches: [master]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
concurrency:
  group: publish-wiki
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/wiki
          preprocess: false
