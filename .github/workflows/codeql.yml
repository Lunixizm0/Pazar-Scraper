name: "CodeQL Analysis"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Local Analysis
            mode: local
            queries: extended
          - name: Remote Extended
            mode: remote
            queries: extended

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Initialize CodeQL (${{ matrix.name }})
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: ${{ matrix.queries }}
          config-file: .github/codeql/codeql-config.yml
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis (${{ matrix.name }})
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python/${{ matrix.mode }}"
          upload: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sarif-category: python-${{ matrix.mode }}

  security-gateway-check:
    name: Security Gateway Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit --desc --format=json --output=pip-audit.json
          python -m pip_audit --desc --format=text

      - name: Run safety check
        run: |
          python -m pip install safety
          safety check --json --output safety.json
          safety check --output safety.txt

      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scans
          path: |
            pip-audit.json
            safety.json
            safety.txt
          retention-days: 30

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff (lint)
        run: uv run ruff check src tests

      - name: Run ruff (format check)
        run: uv run ruff format --check src tests

      - name: Run pyright (typecheck)
        run: uv run pyright src

      - name: Run pytest
        run: uv run pytest -q