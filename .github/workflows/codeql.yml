name: "CodeQL Analysis"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Local Analysis
            mode: local
            queries: security-extended
          - name: Remote Extended
            mode: remote
            queries: security-extended

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --dev

      - name: Initialize CodeQL (${{ matrix.name }})
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: ${{ matrix.queries }}
          config-file: .github/codeql/codeql-config.yml
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis (${{ matrix.name }})
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python/${{ matrix.mode }}"
          upload: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sarif-category: python-${{ matrix.mode }}
          
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff (lint)
        run: uv run ruff check src tests

      - name: Run ruff (format check)
        run: uv run ruff format --check src tests

      - name: Run pyright (typecheck)
        run: uv run pyright src

      - name: Run pytest
        run: uv run pytest -q