name: "Pazar Scraper CodeQL Config"

languages:
  - python

queries:
  - uses: security-extended
  - uses: security-and-quality

paths-ignore:
  - ".venv/**"
  - ".pytest_cache/**"
  - ".ruff_cache/**"
  - ".playwright-mcp/**"
  - "docs/**"
  - "*.md"
  - "*.txt"
  - "*.json"
  - "*.lock"

paths:
  - "src/**"
  - "tests/**"

code-scanning:
  filters:
    - pattern: "tests/**"
      paths-ignore: true
    - pattern: "**/test_*.py"
      paths-ignore: true
    - pattern: "**/*_test.py"
      paths-ignore: true

  auto-fix: true
  experimental: true

database:
  language: python
  python-version: "3.14"
  include-venv: false
  extractor-options:
    python:
      enable-python-extractor: true
      pip-install: false